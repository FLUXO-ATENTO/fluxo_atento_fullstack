# Initial HTTP-only configuration. Install before issuing the certificate.
# It does not touch api.fluxoatento.com.br or any existing server block.
server {
    listen 80;
    listen [::]:80;
    server_name app.fluxoatento.com.br;

    root /srv/fluxo-atento-dashboard/current;
    index index.html;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

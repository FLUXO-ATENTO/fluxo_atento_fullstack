# Final HTTPS configuration. Use only after certbot has issued the certificate.
server {
    listen 80;
    listen [::]:80;
    server_name app.fluxoatento.com.br;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.fluxoatento.com.br;

    root /srv/fluxo-atento-dashboard/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/app.fluxoatento.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.fluxoatento.com.br/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /srv/fluxo-atento-dashboard/current/.nginx-headers.conf;
    add_header Cache-Control "no-store" always;

    location ~ /\. {
        deny all;
    }

    location ^~ /_nuxt/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /srv/fluxo-atento-dashboard/current/.nginx-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        include /srv/fluxo-atento-dashboard/current/.nginx-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

# Add INSIDE the existing api.fluxoatento.com.br TLS server block.
# Do not replace the block, its certificates, /health or /agent/* routes.
# Check nginx -t before reload. The monitor process must listen on loopback only.
# OAuth codes arrive in the callback query string. Do not record the callback
# in inherited access/error logs; keep sanitized application events separately.
# Review any CDN/APM/proxy in front of this block as well. This file is a template,
# not evidence that the deployed proxy has already been updated.
location = /v1/integrations/google/callback {
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 60s;
    proxy_send_timeout 10s;
    proxy_hide_header X-Powered-By;
}

location /v1/ {
    client_max_body_size 8k;
    proxy_pass http://127.0.0.1:8100;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    # Bounded Google discovery can span five 8-second upstream calls.
    proxy_read_timeout 60s;
    proxy_send_timeout 10s;
    proxy_hide_header X-Powered-By;
}
